[project]
name = "transformer"
version = "0.1.0"
description = "Transformer from PyTorch primitives and a positional-encoding length generalization study"
requires-python = ">=3.12"
dependencies = ["torch>=2.4", "matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
